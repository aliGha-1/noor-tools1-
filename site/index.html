<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>NOOR TOOLS | إدارة المخزون</title>

<style>
:root{
 --bg:#0b1220;
 --panel:#111c2e;
 --panel2:#17253b;
 --line:#293b54;
 --text:#f1f5ff;
 --muted:#9aacc5;
 --gold:#f5b942;
 --green:#32d296;
 --red:#ff6878;
 --blue:#5ba7ff;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(circle at 85% 0,#1b3150 0,transparent 35%),var(--bg);
 color:var(--text);
 font-family:Tahoma,Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{
 cursor:pointer;border:0;border-radius:10px;
 padding:11px 14px;font-weight:bold;
 color:#091321;background:var(--gold);
}
button:active{transform:scale(.98)}
button.secondary{
 background:#263852;color:white;border:1px solid #354a67;
}
button.success{background:var(--green)}
button.danger{
 background:#5a2635;color:#ffe5e9;border:1px solid #874052;
}
button.small{padding:7px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:1250px;margin:auto;padding:12px}
.top{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;padding:14px;
 border:1px solid var(--line);background:#101b2cee;
 border-radius:17px;position:sticky;top:5px;z-index:10;
 backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:45px;height:45px;border-radius:13px;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#ffe39a,#c98416);
 color:#142033;font-weight:1000;font-size:23px;
}
.brand h1{font-size:17px;margin:0;letter-spacing:1px}
.brand small{color:var(--muted);font-size:11px}
.top-actions{display:flex;gap:7px;flex-wrap:wrap}
.pagehead{
 display:flex;align-items:center;gap:10px;
 margin:22px 2px 14px;
}
.pagehead h2{margin:0;font-size:22px}
.pagehead p{color:var(--muted);margin:5px 0 0;font-size:12px}
.back{background:#263852;color:white;border:1px solid #354a67}
.grid{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;
}
.card{
 background:linear-gradient(145deg,#142238,#101a2b);
 border:1px solid var(--line);border-radius:16px;
 padding:15px;min-width:0;
}
.stat label{display:block;color:var(--muted);font-size:12px}
.stat strong{display:block;font-size:23px;margin-top:10px;overflow-wrap:anywhere}
.stat .hint{font-size:11px;color:var(--gold);margin-top:6px}
.actions{
 display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
 gap:12px;margin-top:14px;
}
.action{
 min-height:110px;text-align:right;
 background:linear-gradient(140deg,#1a2c45,#121e30);
 border:1px solid var(--line);color:var(--text);padding:15px;
}
.action b{display:block;font-size:15px;margin:8px 0}
.action span{color:var(--muted);font-size:11px;line-height:1.6}
.section{margin-top:14px}
.section h3{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.field label{color:var(--muted);font-size:12px}
.field input,.field select,.field textarea,
.table-input{
 background:#0a1423;color:var(--text);
 border:1px solid #30435d;border-radius:9px;
 padding:10px;width:100%;min-width:0;outline:none;
}
.field input:focus,.field select:focus,.table-input:focus{
 border-color:var(--gold);
}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{
 flex:1;min-width:170px;background:#0a1423;color:white;
 border:1px solid #30435d;border-radius:10px;padding:11px;
}
.table-wrap{
 width:100%;overflow:auto;border:1px solid var(--line);
 border-radius:11px;
}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{
 padding:9px 10px;text-align:right;
 border-bottom:1px solid #263750;white-space:nowrap;
}
th{background:#1b2a40;color:#d4e0f1;font-size:12px}
td{font-size:12px}
tr:last-child td{border-bottom:0}
.table-input{min-width:85px;padding:8px}
.table-input.name{min-width:150px}
.empty{text-align:center;color:var(--muted);padding:24px}
.pill{
 display:inline-block;border-radius:25px;padding:4px 8px;
 font-size:11px;background:#1f3d38;color:#82efc4;
}
.pill.low{background:#4a2a25;color:#ffb0a7}
.totalbar{
 display:flex;justify-content:space-between;align-items:center;
 gap:12px;background:#0a1423;border:1px solid var(--line);
 padding:14px;border-radius:11px;margin-top:12px;flex-wrap:wrap;
}
.totalbar strong{display:block;font-size:21px;color:var(--gold);margin-top:5px}
.note{font-size:11px;color:var(--muted);line-height:1.8}
.hidden{display:none!important}
.line-actions{display:flex;gap:5px}
.toast{
 position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
 background:#eaf5ff;color:#102034;padding:12px 17px;
 border-radius:12px;box-shadow:0 8px 35px #0007;
 z-index:30;max-width:92%;font-weight:bold;font-size:13px;
}
.footer{text-align:center;color:#70839e;font-size:10px;padding:22px 0 10px}
@media(max-width:760px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .actions{grid-template-columns:repeat(2,minmax(0,1fr))}
 .top{align-items:flex-start}
 .brand h1{font-size:14px}
 .top-actions button{padding:9px;font-size:12px}
 .pagehead h2{font-size:19px}
 .app{padding:8px}
 .stat strong{font-size:19px}
}
@media(max-width:390px){
 .logo{width:36px;height:36px}
 .brand small{font-size:9px}
 .action{padding:11px}
}
@media print{
 body{background:white;color:black}
 .top,.pagehead .back,.toolbar,button,.footer{display:none!important}
 .app{max-width:none;padding:0}
 .card{background:white;color:black;border:1px solid #bbb}
 .table-wrap{overflow:visible}
 table{min-width:0}
 th,td{color:black;background:white;border-color:#ccc}
}
</style>
</head>

<body>
<div class="app">

<header class="top">
 <div class="brand">
  <div class="logo">N</div>
  <div>
   <h1>NOOR TOOLS</h1>
   <small>نظام إدارة المخزون والمبيعات</small>
  </div>
 </div>

 <div class="top-actions">
  <button class="secondary" onclick="goHome()">⌂ الرئيسية</button>
  <button class="secondary" onclick="goBack()">↩ رجوع</button>
 </div>
</header>

<main id="view"></main>

<div class="footer">
 NOOR TOOLS · نظام إدارة المخزون · نسخة تجريبية
</div>

</div>

<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";

/* =========================================
   1. البيانات والتخزين
========================================= */

const STORAGE_KEY = "noorToolsDB";

const $ = selector => document.querySelector(selector);

const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
}[char]));

const num = value => {
 const n = Number(value);
 return Number.isFinite(n) && n >= 0 ? n : 0;
};

const money = value =>
 num(value).toLocaleString("ar-EG",{maximumFractionDigits:2}) + " ج.م";

const today = () => {
 const d = new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};

function freshDB(){
 return {
  products:[],
  invoices:[],
  settings:{
   businessName:"NOOR TOOLS",
   lowStock:5
  },
  nextProductId:1,
  nextInvoiceId:1
 };
}

function loadDB(){
 try{
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return freshDB();

  const old = JSON.parse(raw);
  const db = freshDB();

  db.products = Array.isArray(old.products)
   ? old.products.map((p,i)=>({
      id:p.id ?? i+1,
      name:p.name ?? "",
      code:p.code ?? "",
      buy:num(p.buy ?? p.purchasePrice),
      sell:num(p.sell ?? p.salePrice),
      qty:num(p.qty ?? p.quantity),
      low:num(p.low ?? old.settings?.lowStock ?? 5)
     }))
   : [];

  db.invoices = Array.isArray(old.invoices)
   ? old.invoices.map((inv,i)=>({
      id:inv.id ?? i+1,
      number:inv.number ?? String(i+1).padStart(5,"0"),
      type:inv.type ?? (inv.kind==="purchase"?"purchase":inv.kind==="sale"?"sale":""),
      date:inv.date ?? today(),
      party:inv.party ?? inv.supplier ?? inv.customer ?? "",
      note:inv.note ?? "",
      items:Array.isArray(inv.items)
       ? inv.items.map(it=>({
          productId:it.productId ?? it.id,
          name:it.name ?? "",
          code:it.code ?? "",
          qty:num(it.qty ?? it.quantity),
          price:num(it.price ?? it.unitPrice)
         }))
       : []
     })).filter(inv=>inv.type==="sale"||inv.type==="purchase")
   : [];

  db.settings = {...db.settings,...(old.settings||{})};
  db.nextProductId = Math.max(0,...db.products.map(p=>Number(p.id)||0))+1;
  db.nextInvoiceId = Math.max(0,...db.invoices.map(i=>Number(i.id)||0))+1;

  return db;
 }catch(error){
  return freshDB();
 }
}

let db = loadDB();
let currentPage = "dashboard";
let pageHistory = ["dashboard"];
let invoiceDraft = null;

function saveDB(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  return true;
 }catch(error){
  showToast("تعذر حفظ البيانات. مساحة التخزين قد تكون ممتلئة.");
  return false;
 }
}

function showToast(message){
 const el = $("#toast");
 el.textContent = message;
 el.classList.remove("hidden");
 clearTimeout(showToast.timer);
 showToast.timer = setTimeout(()=>el.classList.add("hidden"),3000);
}

function productById(id){
 return db.products.find(p=>String(p.id)===String(id));
}

function invoiceTotal(invoice){
 return invoice.items.reduce((sum,item)=>sum+num(item.qty)*num(item.price),0);
}

/* =========================================
   2. التنقل وأزرار الرجوع
========================================= */

function navigate(page){
 if(currentPage!==page){
  pageHistory.push(currentPage);
 }
 currentPage=page;
 render();
}

function goHome(){
 pageHistory=["dashboard"];
 currentPage="dashboard";
 invoiceDraft=null;
 render();
}

function goBack(){
 if(pageHistory.length>1){
  currentPage=pageHistory.pop();
 }else{
  currentPage="dashboard";
 }
 render();
}

function pageHead(title,subtitle=""){
 return `
 <div class="pagehead">
  <button class="back" onclick="goBack()">↩ رجوع</button>
  <div>
   <h2>${title}</h2>
   ${subtitle?`<p>${subtitle}</p>`:""}
  </div>
 </div>`;
}

function stat(title,value,hint=""){
 return `
 <div class="card stat">
  <label>${title}</label>
  <strong>${value}</strong>
  <div class="hint">${hint}</div>
 </div>`;
}

/* =========================================
   3. الصفحة الرئيسية
========================================= */

function dashboard(){
 const sales=db.invoices.filter(i=>i.type==="sale");
 const purchases=db.invoices.filter(i=>i.type==="purchase");

 const saleTotal=sales.reduce((s,i)=>s+invoiceTotal(i),0);
 const stockValue=db.products.reduce((s,p)=>s+p.qty*p.buy,0);
 const stockUnits=db.products.reduce((s,p)=>s+p.qty,0);

 const low=db.products.filter(
  p=>p.qty<=num(p.low ?? db.settings.lowStock)
 );

 return `
 ${pageHead("لوحة التحكم","أهلاً بك في نظام NOOR TOOLS")}

 <div class="grid">
  ${stat("عدد الأصناف",db.products.length,"صنف مسجل")}
  ${stat("وحدات المخزون",stockUnits,"وحدة متاحة")}
  ${stat("إجمالي المبيعات",money(saleTotal),sales.length+" فاتورة")}
  ${stat("قيمة المخزون",money(stockValue),"بسعر الشراء")}
 </div>

 <div class="actions">
  <button class="action" onclick="navigate('products')">
   📦<b>المنتجات والمخزون</b>
   <span>إضافة وتعديل وبحث عن المنتجات</span>
  </button>

  <button class="action" onclick="startInvoice('purchase')">
   🛒<b>فاتورة مشتريات</b>
   <span>أصناف متعددة وزيادة المخزون</span>
  </button>

  <button class="action" onclick="startInvoice('sale')">
   🧾<b>فاتورة مبيعات</b>
   <span>بيع أصناف متعددة وخصم الكميات</span>
  </button>

  <button class="action" onclick="navigate('bulk')">
   📋<b>إضافة منتجات بالجملة</b>
   <span>إضافة 100 منتج أو أكثر دفعة واحدة</span>
  </button>

  <button class="action" onclick="navigate('invoices')">
   📚<b>سجل الفواتير</b>
   <span>عرض وطباعة وحذف الفواتير</span>
  </button>

  <button class="action" onclick="navigate('reports')">
   📊<b>التقارير</b>
   <span>المبيعات والمشتريات والمخزون</span>
  </button>

  <button class="action" onclick="navigate('backup')">
   💾<b>النسخ الاحتياطي</b>
   <span>تصدير البيانات واستعادتها</span>
  </button>

  <button class="action" onclick="navigate('settings')">
   ⚙️<b>الإعدادات</b>
   <span>اسم النشاط وحد تنبيه المخزون</span>
  </button>
 </div>

 <div class="section card">
  <h3>⚠️ أصناف منخفضة المخزون (${low.length})</h3>
  ${
   low.length
   ? `<div class="table-wrap">
       <table>
        <thead><tr><th>المنتج</th><th>الكود</th><th>الكمية</th><th>حد التنبيه</th></tr></thead>
        <tbody>
         ${low.slice(0,10).map(p=>`
          <tr>
           <td>${esc(p.name)}</td>
           <td>${esc(p.code)}</td>
           <td><span class="pill low">${p.qty}</span></td>
           <td>${num(p.low ?? db.settings.lowStock)}</td>
          </tr>`).join("")}
        </tbody>
       </table>
      </div>`
   : '<div class="empty">لا توجد أصناف منخفضة المخزون.</div>'
  }
 </div>`;
}/* =========================================
   4. إدارة المنتجات والمخزون
========================================= */

function productsPage(){
 return `
 ${pageHead("المنتجات والمخزون","إدارة الأصناف والكميات والأسعار")}

 <div class="card">
  <div class="toolbar">
   <input id="productSearch"
          placeholder="ابحث باسم المنتج أو الكود..."
          oninput="filterProducts()">

   <button onclick="navigate('bulk')">＋ إضافة جماعية</button>
   <button class="secondary" onclick="addProduct()">＋ منتج جديد</button>
  </div>

  <div class="table-wrap">
   <table>
    <thead>
     <tr>
      <th>#</th>
      <th>اسم المنتج</th>
      <th>الكود</th>
      <th>سعر الشراء</th>
      <th>سعر البيع</th>
      <th>الكمية</th>
      <th>حد التنبيه</th>
      <th>الإجراءات</th>
     </tr>
    </thead>
    <tbody id="productsBody">${productRows()}</tbody>
   </table>
  </div>

  <p class="note">
   عدّل البيانات ثم اضغط حفظ. يُفضّل تسجيل الوارد والصادر عن طريق الفواتير
   حتى تظل حركة المخزون صحيحة.
  </p>
 </div>`;
}

function productRows(list=db.products){
 if(!list.length){
  return `<tr><td colspan="8" class="empty">
   لا توجد منتجات. أضف منتجًا جديدًا أو استخدم الإضافة الجماعية.
  </td></tr>`;
 }

 return list.map(p=>`
  <tr data-id="${esc(p.id)}">
   <td>${esc(p.id)}</td>

   <td>
    <input class="table-input name" data-k="name"
           value="${esc(p.name)}">
   </td>

   <td>
    <input class="table-input" data-k="code"
           value="${esc(p.code)}">
   </td>

   <td>
    <input class="table-input" data-k="buy" type="number"
           min="0" step="0.01" value="${num(p.buy)}">
   </td>

   <td>
    <input class="table-input" data-k="sell" type="number"
           min="0" step="0.01" value="${num(p.sell)}">
   </td>

   <td>
    <input class="table-input" data-k="qty" type="number"
           min="0" step="1" value="${num(p.qty)}">
   </td>

   <td>
    <input class="table-input" data-k="low" type="number"
           min="0" step="1" value="${num(p.low ?? 5)}">
   </td>

   <td>
    <div class="line-actions">
     <button class="small"
             onclick="saveProduct(${JSON.stringify(String(p.id))})">
      حفظ
     </button>

     <button class="small danger"
             onclick="deleteProduct(${JSON.stringify(String(p.id))})">
      حذف
     </button>
    </div>
   </td>
  </tr>
 `).join("");
}

function addProduct(){
 const id=db.nextProductId++;

 db.products.push({
  id,
  name:"",
  code:"",
  buy:0,
  sell:0,
  qty:0,
  low:num(db.settings.lowStock)
 });

 saveDB();
 render();

 const row=[...document.querySelectorAll("#productsBody tr")]
  .find(r=>r.dataset.id===String(id));

 if(row){
  row.querySelector('[data-k="name"]').focus();
 }

 showToast("اكتب اسم المنتج ثم اضغط حفظ.");
}

function saveProduct(id){
 const row=[...document.querySelectorAll("#productsBody tr")]
  .find(r=>r.dataset.id===String(id));

 const product=productById(id);

 if(!row || !product) return;

 const value=k=>row.querySelector(`[data-k="${k}"]`).value.trim();

 const name=value("name");
 const code=value("code");

 if(!name){
  showToast("اكتب اسم المنتج أولًا.");
  return;
 }

 if(code && db.products.some(p=>
  String(p.id)!==String(id) && p.code.trim()===code
 )){
  showToast("كود المنتج مستخدم بالفعل.");
  return;
 }

 product.name=name;
 product.code=code;
 product.buy=num(value("buy"));
 product.sell=num(value("sell"));
 product.qty=Math.floor(num(value("qty")));
 product.low=Math.floor(num(value("low")));

 if(saveDB()){
  render();
  showToast("تم حفظ المنتج بنجاح.");
 }
}

function deleteProduct(id){
 const product=productById(id);
 if(!product) return;

 const hasInvoices=db.invoices.some(inv=>
  inv.items.some(item=>String(item.productId)===String(id))
 );

 if(hasInvoices){
  showToast("لا يمكن حذف منتج مرتبط بفواتير سابقة.");
  return;
 }

 if(!confirm(`هل تريد حذف المنتج "${product.name}"؟`)) return;

 db.products=db.products.filter(p=>String(p.id)!==String(id));

 saveDB();
 render();
 showToast("تم حذف المنتج.");
}

function filterProducts(){
 const input=$("#productSearch");
 if(!input) return;

 const query=input.value.trim().toLowerCase();

 const filtered=db.products.filter(p=>
  String(p.name).toLowerCase().includes(query) ||
  String(p.code).toLowerCase().includes(query)
 );

 $("#productsBody").innerHTML=productRows(filtered);
}


/* =========================================
   5. إضافة 100 منتج أو أكثر مرة واحدة
========================================= */

function bulkPage(){
 return `
 ${pageHead("إضافة المنتجات بالجملة","أدخل عشرات أو مئات المنتجات ثم احفظها مرة واحدة")}

 <div class="card">

  <div class="toolbar">
   <button onclick="addBulkRows(1)">＋ صف جديد</button>
   <button class="secondary" onclick="addBulkRows(20)">＋ 20 صفًا</button>
   <button class="secondary" onclick="addBulkRows(100)">＋ 100 صف</button>
   <button class="danger" onclick="clearBulkRows()">تفريغ الجدول</button>
  </div>

  <div class="table-wrap">
   <table>
    <thead>
     <tr>
      <th>#</th>
      <th>اسم المنتج *</th>
      <th>الكود</th>
      <th>سعر الشراء</th>
      <th>سعر البيع</th>
      <th>الكمية</th>
      <th>حد التنبيه</th>
      <th>حذف الصف</th>
     </tr>
    </thead>

    <tbody id="bulkBody">${bulkRows(10)}</tbody>
   </table>
  </div>

  <div class="totalbar">
   <div>
    <b id="bulkCount">10 صفوف</b>
    <p class="note">
     اترك الصفوف الفارغة كما هي. اكتب اسم المنتج على الأقل.
     إذا كان الكود موجودًا بالفعل، فسيتم تحديث بيانات المنتج الموجود.
    </p>
   </div>

   <button class="success" onclick="saveBulkProducts()">
    حفظ كل المنتجات
   </button>
  </div>

 </div>`;
}

function bulkRows(count){
 return Array.from({length:count},(_,i)=>`
  <tr>
   <td>${i+1}</td>

   <td>
    <input class="table-input name" data-k="name"

function addBulkRows(count){
 const body=$("#bulkBody");
 if(!body) return;

 const current=body.rows.length;

 if(current+count>1000){
  showToast("يمكن إدخال 1000 صف كحد أقصى في المرة الواحدة.");
  return;
 }

 body.insertAdjacentHTML("beforeend",bulkRows(count));
 renumberBulk();
}

function renumberBulk(){
 const body=$("#bulkBody");
 if(!body) return;

 [...body.rows].forEach((row,index)=>{
  row.cells[0].textContent=index+1;
 });

 const counter=$("#bulkCount");
 if(counter) counter.textContent=body.rows.length+" صف";
}

function clearBulkRows(){
 if(!confirm("هل تريد تفريغ جميع الصفوف غير المحفوظة؟")) return;

 $("#bulkBody").innerHTML=bulkRows(10);
 renumberBulk();
}

function saveBulkProducts(){
 const rows=[...document.querySelectorAll("#bulkBody tr")];
 const entries=[];
 const codes=new Set();

 for(let index=0;index<rows.length;index++){
  const row=rows[index];
  const val=k=>row.querySelector(`[data-k="${k}"]`).value.trim();

  const name=val("name");
  const code=val("code");

  if(!name) continue;

  if(code && codes.has(code)){
   showToast("الكود "+code+" مكرر داخل الجدول.");
   return;
  }

  if(code) codes.add(code);

  const qtyText=val("qty");
  const buyText=val("buy");
  const sellText=val("sell");

  if(
   !Number.isFinite(Number(qtyText)) ||
   Number(qtyText)<0 ||
   !Number.isInteger(Number(qtyText))
  ){
   showToast("راجع الكمية في صف "+(index+1)+".");
   return;
  }

  if(
   !Number.isFinite(Number(buyText)) ||
   Number(buyText)<0 ||
   !Number.isFinite(Number(sellText)) ||
   Number(sellText)<0
  ){
   showToast("راجع الأسعار في صف "+(index+1)+".");
   return;
  }

  entries.push({
   name,
   code,
   buy:Number(buyText),
   sell:Number(sellText),
   qty:Number(qtyText),
   low:Math.floor(num(val("low")))
  });
 }

 if(entries.length===0){
  showToast("اكتب اسم منتج واحد على الأقل.");
  return;
 }

 /* التحقق من الأكواد قبل تغيير أي بيانات */
 for(const entry of entries){
  if(!entry.code) continue;

  const existing=db.products.find(p=>p.code===entry.code);

  if(existing && db.invoices.some(inv=>
   inv.items.some(item=>
    String(item.productId)===String(existing.id)
   )
  )){
   /*
    المنتج له فواتير سابقة.
    نسمح بتحديث الاسم والأسعار، لكن لا نغيّر رصيده
    من شاشة الإضافة الجماعية حتى لا نكسر حركة المخزون.
   */
   entry.lockQuantity=true;
  }
 }

 for(const entry of entries){
  let existing=entry.code
   ? db.products.find(p=>p.code===entry.code)
   : null;

  if(existing){
   existing.name=entry.name;
   existing.buy=entry.buy;
   existing.sell=entry.sell;
   existing.low=entry.low;

   if(!entry.lockQuantity){
    existing.qty=entry.qty;
   }
  }else{
   db.products.push({
    id:db.nextProductId++,
    name:entry.name,
    code:entry.code,
    buy:entry.buy,
    sell:entry.sell,
    qty:entry.qty,
    low:entry.low
   });
  }
 }

 if(saveDB()){
  showToast("تم حفظ "+entries.length+" منتج بنجاح.");
  navigate("products");
 }
}// ===== الجزء الثالث: فواتير البيع والشراء =====

function removeInvoiceRow(index) {
  if (invoiceDraft.items.length === 1) {
    invoiceDraft.items[0] = { productId: "", qty: 1, price: 0 };
  } else {
    invoiceDraft.items.splice(index, 1);
  }
  render();
}

function changeInvoiceProduct(index, productId) {
  const item = invoiceDraft.items[index];
  item.productId = productId;

  const product = productById(productId);
  if (product) {
    item.price = invoiceDraft.type === "sale"
      ? num(product.sell)
      : num(product.buy);
  } else {
    item.price = 0;
  }

  render();
}

function changeInvoiceQty(index, value) {
  invoiceDraft.items[index].qty = value;
  updateInvoiceTotal();
}

function changeInvoicePrice(index, value) {
  invoiceDraft.items[index].price = value;
  updateInvoiceTotal();
}

function updateInvoiceTotal() {
  if (!invoiceDraft) return;

  const party = $("#invParty");
  const date = $("#invDate");
  const note = $("#invNote");

  if (party) invoiceDraft.party = party.value;
  if (date) invoiceDraft.date = date.value;
  if (note) invoiceDraft.note = note.value;

  let total = 0;

  invoiceDraft.items.forEach(item => {
    const qty = num(item.qty);
    const price = num(item.price);
    total += qty * price;
  });

  const totalElement = $("#invoiceGrandTotal");
  if (totalElement) totalElement.textContent = money(total);
}

function saveInvoice() {
  if (!invoiceDraft) return;

  updateInvoiceTotal();

  const type = invoiceDraft.type;
  const party = String(invoiceDraft.party || "").trim();
  const date = invoiceDraft.date || today();

  const items = invoiceDraft.items
    .map(item => ({
      productId: item.productId,
      qty: Number(item.qty),
      price: Number(item.price)
    }))
    .filter(item => item.productId !== "");

  if (!items.length) {
    showToast("اختار صنف واحد على الأقل");
    return;
  }

  for (const item of items) {
    const product = productById(item.productId);

    if (!product) {
      showToast("فيه صنف غير موجود، راجع الفاتورة");
      return;
    }

    if (!Number.isInteger(item.qty) || item.qty < 1) {
      showToast("الكمية لازم تكون عددًا صحيحًا أكبر من صفر");
      return;
    }

    if (!Number.isFinite(item.price) || item.price < 0) {
      showToast("راجع سعر الصنف");
      return;
    }
  }

  // نجمع الكميات لو الصنف اتكرر في أكثر من سطر.
  const quantities = {};

  items.forEach(item => {
    quantities[item.productId] =
      (quantities[item.productId] || 0) + item.qty;
  });

  // التحقق من المخزون قبل أي تعديل في فاتورة البيع.
  if (type === "sale") {
    for (const productId in quantities) {
      const product = productById(productId);

      if (num(product.qty) < quantities[productId]) {
        showToast(
          `الكمية غير كافية للصنف: ${product.name} — المتاح ${num(product.qty)}`
        );
        return;
      }
    }
  }

  const savedItems = items.map(item => {
    const product = productById(item.productId);

    return {
      productId: product.id,
      name: product.name,
      code: product.code || "",
      qty: item.qty,
      price: item.price,
      total: item.qty * item.price
    };
  });

  // تعديل المخزون بعد اجتياز جميع عمليات التحقق.
  for (const productId in quantities) {
    const product = productById(productId);

    if (type === "sale") {
      product.qty = num(product.qty) - quantities[productId];
    } else {
      product.qty = num(product.qty) + quantities[productId];
    }
  }

  const nextNumber = db.invoices.reduce((max, invoice) => {
    return Math.max(max, num(invoice.id));
  }, 0) + 1;

  const invoice = {
    id: nextNumber,
    number: (type === "sale" ? "S-" : "P-") +
      String(nextNumber).padStart(5, "0"),
    type,
    date,
    party,
    note: String(invoiceDraft.note || "").trim(),
    items: savedItems,
    total: savedItems.reduce((sum, item) => sum + item.total, 0),
    createdAt: new Date().toISOString()
  };

  db.invoices.push(invoice);

  if (!saveDB()) {
    showToast("تعذر حفظ البيانات؛ راجع مساحة التخزين");
    return;
  }

  invoiceDraft = null;
  showToast("تم حفظ الفاتورة وتحديث المخزون بنجاح");
  navigate("invoices");
}// ===== الجزء الرابع: قائمة الفواتير وعرضها وطباعتها =====

function filterInvoices() {
  const body = $("#invoicesTableBody");
  if (!body) return;

  const search = ($("#invoiceSearch")?.value || "").trim().toLowerCase();
  const type = $("#invoiceTypeFilter")?.value || "all";

  const invoices = [...db.invoices]
    .filter(invoice => {
      const matchesType = type === "all" || invoice.type === type;

      const text = [
        invoice.number,
        invoice.party,
        invoice.date,
        invoice.note
      ].join(" ").toLowerCase();

      return matchesType && text.includes(search);
    })
    .sort((a, b) => num(b.id) - num(a.id));

  if (!invoices.length) {
    body.innerHTML = `
      <tr>
        <td colspan="7" class="empty-state">لا توجد فواتير مطابقة</td>
      </tr>
    `;
    return;

  body.innerHTML = invoices.map(invoice => `

          onclick="viewInvoice(${Number(invoice.id)})">

      </td>
    </tr>
  `).join("");
}

    return;
  }

  if (!confirm(
    `هل أنت متأكد من حذف الفاتورة ${invoice.number || invoice.id}؟ سيتم تعديل المخزون.`
  )) {
    return;
  }

  // تجميع الكميات لكل صنف لتفادي تكرار الصنف في الفاتورة.
  const quantities = {};

  (invoice.items || []).forEach(item => {
    quantities[item.productId] =
      (quantities[item.productId] || 0) + num(item.qty);
  });

  // عند حذف فاتورة شراء، لا نسمح بإنقاص المخزون إلى قيمة سالبة.
  if (invoice.type === "purchase") {
    for (const productId in quantities) {
      const product = productById(productId);

      if (product && num(product.qty) < quantities[productId]) {
        showToast(
          `لا يمكن حذف الفاتورة؛ مخزون ${product.name} أقل من الكمية المشتراة في هذه الفاتورة`
        );
        return;
      }
    }
  }

  for (const productId in quantities) {
    const product = productById(productId);

    if (!product) continue;

    if (invoice.type === "sale") {
      // حذف فاتورة البيع يعيد الكمية المباعة للمخزون.
      product.qty = num(product.qty) + quantities[productId];
    } else {
      // حذف فاتورة الشراء يخصم الكمية التي أضافتها الفاتورة.
      product.qty = num(product.qty) - quantities[productId];
    }
  }

  db.invoices = db.invoices.filter(
    item => Number(item.id) !== Number(id)
  );

  if (!saveDB()) {
    showToast("تعذر حفظ التغييرات");
    return;
  }

  showToast("تم حذف الفاتورة وتعديل المخزون");
  navigate("invoices");
}// ===== الجزء الخامس: التقارير =====

          </tbody>

    <section class="card">

function exportBackup() {
  try {
    const backup = {
      app: "NOOR TOOLS",
      version: 1,
      exportedAt: new Date().toISOString(),
      data: db
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = `NOOR-TOOLS-backup-${today()}.json`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    showToast("تم تجهيز النسخة الاحتياطية");
  } catch (error) {
    console.error(error);
    showToast("تعذر إنشاء النسخة الاحتياطية");
  }
}

async function importBackup() {
  const input = $("#backupFile");
  const file = input?.files?.[0];

  if (!file) {
    showToast("اختار ملف النسخة الاحتياطية أولًا");
    return;
  }

  if (!confirm(
    "تنبيه: استعادة النسخة الاحتياطية ستستبدل البيانات الحالية. هل تريد المتابعة؟"
  )) {
    return;
  }

  try {
    const textContent = await file.text();
    const parsed = JSON.parse(textContent);

    const restored = parsed.data || parsed;

    if (
      !restored ||
      !Array.isArray(restored.products) ||
      !Array.isArray(restored.invoices) ||
      typeof restored.settings !== "object" ||
      restored.settings === null
    ) {
      showToast("ملف النسخة الاحتياطية غير صالح");
      return;
    }

    // التحقق الأساسي من سلامة بنية المنتجات.
    const productsValid = restored.products.every(p =>
      p &&
      p.id !== undefined &&
      typeof p.name === "string" &&
      Number.isFinite(Number(p.qty)) &&
      Number(p.qty) >= 0
    );

    if (!productsValid) {
      showToast("بيانات المنتجات في الملف غير سليمة");
      return;
    }

    // التحقق من الفواتير وأصناف كل فاتورة.
    const invoicesValid = restored.invoices.every(invoice =>
      invoice &&
      invoice.id !== undefined &&
      ["sale", "purchase"].includes(invoice.type) &&
      Array.isArray(invoice.items) &&
      invoice.items.every(item =>
        item &&
        item.productId !== undefined &&
        Number.isFinite(Number(item.qty)) &&
        Number(item.qty) > 0 &&
        Number.isFinite(Number(item.price)) &&
        Number(item.price) >= 0
      )
    );

    if (!invoicesValid) {
      showToast("بيانات الفواتير في الملف غير سليمة");
      return;
    }

    const previousDB = db;

    db = {
      products: restored.products,
      invoices: restored.invoices,
      settings: restored.settings
    };

    if (!saveDB()) {
      db = previousDB;
      showToast("تعذر حفظ البيانات المستعادة");
      return;
    }

    invoiceDraft = null;

    showToast("تمت استعادة النسخة الاحتياطية بنجاح");
    navigate("dashboard");
  } catch (error) {
    console.error(error);
    showToast("تعذر قراءة الملف؛ تأكد أنه نسخة احتياطية صحيحة");
  }
}

function saveSettings() {
  const nameInput = $("#settingBusinessName");
  const limitInput = $("#settingLowStock");

  const businessName = String(nameInput?.value || "").trim();
  const lowStockLimit = Number(limitInput?.value);

  if (!businessName) {
    showToast("اكتب اسم المحل");
    return;
  }

  if (
    !Number.isInteger(lowStockLimit) ||
    !Number.isFinite(lowStockLimit) ||
    lowStockLimit < 0
  ) {
    showToast("حد المخزون يجب أن يكون صفرًا أو عددًا صحيحًا موجبًا");
    return;
  }

  const previousSettings = { ...db.settings };

  db.settings = {
    ...db.settings,
    businessName,
    lowStockLimit
  };

  if (!saveDB()) {
    db.settings = previousSettings;
    showToast("تعذر حفظ الإعدادات");
    return;
  }

  showToast("تم حفظ الإعدادات بنجاح");
  render();
}// ===== الجزء السابع: ربط الصفحات وتشغيل التطبيق =====

function render() {
  const view = $("#view");
  if (!view) return;

  switch (currentPage) {
    case "dashboard":
      dashboard();
      break;

    case "products":
      productsPage();
      break;

    case "bulk":
      bulkPage();
      break;

    case "saleNew":
      invoicePage("sale");
      break;

    case "purchaseNew":
      invoicePage("purchase");
      break;

    case "invoices":
      invoicesPage();
      break;

    case "reports":
      reportsPage();
      break;

    case "backup":
      backupPage();
      break;

    case "settings":
      settingsPage();
      break;

    default:
      currentPage = "dashboard";
      dashboard();
      break;
  }

  // إظهار أزرار التنقل حسب العناصر الموجودة في الصفحة.
  const homeButtons = document.querySelectorAll(
    '[onclick="goHome()"]'
  );

  homeButtons.forEach(button => {
    button.style.display = "inline-flex";

  const backButtons = document.querySelectorAll(
    '[onclick="goBack()"]'
  );

  backButtons.forEach(button => {
    button.style.display = "inline-flex";
  });
}
